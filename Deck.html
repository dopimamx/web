  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

div class=\"t\">Revisión conjunta en 48 hrs<\u002Fdiv>\n          <div class=\"d\">Martes 13 · sesión de 30 min<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"check-item\">\n        <div class=\"check-box\"><\u002Fdiv>\n        <div>\n          <div class=\"t\">Validación interna con tu equipo<\u002Fdiv>\n          <div class=\"d\">Personas clave · <span class=\"editable\" contenteditable=\"true\">[nombres]<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"check-item\">\n        <div class=\"check-box\"><\u002Fdiv>\n        <div>\n          <div class=\"t\">Accesos técnicos (Meta · dominio)<\u002Fdiv>\n          <div class=\"d\">Entregable de tu lado<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"check-item\">\n        <div class=\"check-box\"><\u002Fdiv>\n        <div>\n          <div class=\"t\">Firma + kickoff<\u002Fdiv>\n          <div class=\"d\">Semana del 22 de mayo<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"next-foot\">\n      <div>\n        <div class=\"lbl\">dopima · sistema comercial llave en mano<\u002Fdiv>\n        <div class=\"val\">Gracias por tu tiempo. Ahora decidimos juntos.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"contact\">\n        <div>hola@dopima.com<\u002Fdiv>\n        <div>wa.link/sw90lb<\u002Fdiv>\n        <div>dopima.com<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"page-no\">15 / 15<\u002Fdiv>\n  <div class=\"page-tag\">Cierre<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script src=\"4e2cedb8-a0aa-4b55-8f83-3cd42f1a385a\"><\u002Fscript>\n<script>\n// ===== Calculadora de costo oculto =====\n(function(){\n  const $ = id => document.getElementById(id);\n  const inputs = ['calc-leads','calc-resp','calc-cita','calc-ticket','calc-cierre','calc-inv'].map($);\n  const fmt = n => {\n    if(!isFinite(n) || n<=0) return '—';\n    if(n >= 1e6) return (n/1e6).toFixed(1).replace(/\\.0$/,'') + 'M';\n    if(n >= 1e3) return Math.round(n/1e3) + 'K';\n    return Math.round(n).toLocaleString('es-MX');\n  };\n  const fmtFull = n => !isFinite(n)||n<=0 ? '—' : '$' + Math.round(n).toLocaleString('es-MX');\n  // Dopima precio ancla para comparación (Plan Automatizado anual estimado)\n  const DOPIMA_ANUAL = 240000;\n\n  // Curva de pérdida por tiempo de respuesta — basada en estudios de lead-response (InsideSales/Harvard)\n  function lossRate(respMin){\n    if(respMin <= 0)   return 0;\n    if(respMin <= 5)   return 0.05;   // contacto casi inmediato\n    if(respMin <= 30)  return 0.30;   // ventana dorada perdida\n    if(respMin <= 60)  return 0.50;   // probabilidad cae ~50%\n    if(respMin <= 240) return 0.65;   // 4 horas: mayoría ya fue contactada por competencia\n    if(respMin <= 1440)return 0.78;   // 24 horas\n    return 0.85;                      // >24h: lead prácticamente muerto\n  }\n\n  function calc(){\n    const leads = +$('calc-leads').value || 0;\n    const resp  = +$('calc-resp').value || 0;      // min\n    const cita  = (+$('calc-cita').value || 0)/100;\n    const ticket= +$('calc-ticket').value || 0;\n    const cierre= (+$('calc-cierre').value || 0)/100;\n    const inv   = +$('calc-inv').value || 0;        // inversión mensual MXN\n\n    const defaults = id => id==='out-mes' ? '—' : (id.match(/ano|burn|recup/) ? '$—' : '—');\n    if(!leads || !ticket){\n      ['out-mes','out-leads','out-ano','out-burn','out-cac','out-ventas','out-recup','out-roi'].forEach(id=>{ $(id).textContent = defaults(id); });\n      updateChart(0);\n      return;\n    }\n\n    const rate = lossRate(resp);\n    const leadsLost = leads * rate;\n    // Revenue perdido: asume que esos leads, contactados a tiempo, convertirían a la misma tasa actual del equipo\n    const revenueLostMonth = leadsLost * cita * cierre * ticket;\n    const revenueLostYear  = revenueLostMonth * 12;\n\n    // Inversión quemada = fracción de la inversión que se va a leads que nunca contactaste a tiempo\n    const burnedInv = inv * rate;\n\n    // CAC reportado vs. CAC real\n    const ventasActuales = leads * (1 - rate) * cita * cierre;\n    const ventasPotenciales = leads * cita * cierre;\n    const cacReportado = ventasActuales > 0 ? inv / ventasActuales : 0;\n    const cacPotencial = ventasPotenciales > 0 ? inv / ventasPotenciales : 0;\n    const cacMult = (cacPotencial > 0 && cacReportado > 0) ? (cacReportado / cacPotencial) : 0;\n\n    // Impacto Dopima: recupera ~70% de los leads perdidos (contacto <60s + follow-up automático)\n    const DOPIMA_RECOVERY = 0.70;\n    const ventasRecuperables = leadsLost * DOPIMA_RECOVERY * cita * cierre;\n    const revenueRecuperable = ventasRecuperables * ticket;\n    // ROI vs. costo mensual Dopima (ancla $20K MXN/mes plan Automatizado)\n    const DOPIMA_MENSUAL = 20000;\n    const roi = revenueRecuperable / DOPIMA_MENSUAL;\n\n    $('out-mes').textContent = fmt(revenueLostMonth);\n    $('out-leads').textContent = Math.round(leadsLost).toLocaleString('es-MX') + ' leads';\n    $('out-ano').textContent = fmtFull(revenueLostYear);\n    $('out-burn').textContent = inv > 0 ? fmtFull(burnedInv) : '$—';\n    $('out-cac').textContent = cacMult > 0 ? cacMult.toFixed(1) + '× más caro' : '—';\n    $('out-ventas').textContent = ventasRecuperables >= 1 ? ventasRecuperables.toFixed(1).replace(/\\.0$/,'') : ventasRecuperables.toFixed(2);\n    $('out-recup').textContent = fmtFull(revenueRecuperable);\n    $('out-roi').textContent = roi > 0 ? roi.toFixed(0) + '×' : '—';\n\n    updateChart(revenueLostMonth);\n  }\n\n  // Slide 9 — barras acumuladas\n  function updateChart(monthly){\n    const bars = document.querySelectorAll('.s9-chart .bar');\n    const total = document.querySelector('.s9-chart .big-total .v .editable');\n    const yAxis = document.querySelectorAll('.s9-chart .y-axis span');\n    if(!bars.length) return;\n\n    if(monthly<=0){\n      bars.forEach(b=>{ b.querySelector('.val').textContent = '$—'; });\n      if(total) total.textContent = '—';\n      yAxis.forEach((el,i)=>{ el.textContent = i===4 ? '$0' : '$—'; });\n      return;\n    }\n\n    // Brecha competitiva: crece 8% mensual compuesto a partir de M7\n    const values = [];\n    for(let m=1; m<=12; m++){\n      let v = monthly;\n      if(m>=7) v = monthly * Math.pow(1.08, m-6);\n      values.push(v);\n    }\n    const max = Math.max(...values);\n    const sum = values.reduce((a,b)=>a+b,0);\n\n    bars.forEach((b,i)=>{\n      const v = values[i];\n      const h = Math.max(10, (v/max)*95);\n      b.querySelector('.bar-body').style.height = h + '%';\n      b.querySelector('.val').textContent = fmtFull(v).replace('$','$');\n    });\n\n    if(total) total.textContent = Math.round(sum).toLocaleString('es-MX');\n    // Y-axis labels\n    for(let i=0; i<5; i++){\n      const frac = (4-i)/4;\n      yAxis[i].textContent = i===4 ? '$0' : fmtFull(max*frac);\n    }\n  }\n\n  inputs.forEach(i => i && i.addEventListener('input', calc));\n\n  // Botón \"precargar ejemplo\" — doble-click sobre cualquier input para usar defaults\n  inputs.forEach(i => i && i.addEventListener('dblclick', () => {\n    inputs.forEach(inp => { if(inp.dataset.default) inp.value = inp.dataset.default; });\n    calc();\n  }));\n  calc();\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
